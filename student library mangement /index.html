<!DOCTYPE html>
<html>
<head>
    <title>Student Library Management</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            color: #333;
        }

        /* top bar */
        .header {
            background-color: #1e3a5f;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header span {
            font-size: 14px;
            color: #b8c9e0;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        /* form box */
        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
            margin-bottom: 20px;
        }

        .card h3 {
            margin-top: 0;
            color: #1e3a5f;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            border: 1px solid #ccd3dc;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2d7dd2;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-save {
            background-color: #2d7dd2;
            color: white;
        }

        .btn-save:hover {
            background-color: #1f66b3;
        }

        .btn-clear {
            background-color: #e4e8ee;
            color: #333;
        }

        /* table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #1e3a5f;
            color: white;
            text-align: left;
            padding: 12px;
            font-weight: normal;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e4e8ee;
        }

        tr:hover td {
            background-color: #f0f5fb;
        }

        .tag {
            background-color: #dce9f8;
            color: #1e3a5f;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 13px;
        }

        .btn-edit {
            background-color: #e8a317;
            color: white;
            padding: 6px 12px;
        }

        .btn-delete {
            background-color: #d9534f;
            color: white;
            padding: 6px 12px;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #888;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Student Library</h1>
        <span id="count">0 books</span>
    </div>

    <div class="container">

        <div class="card">
            <h3 id="formHeading">Add New Book</h3>
            <div class="form-row">
                <input type="text" id="title" placeholder="Book title">
                <input type="text" id="author" placeholder="Author name">
                <input type="text" id="category" placeholder="Category">
            </div>
            <br>
            <button class="btn-save" onclick="saveBook()">Save Book</button>
            <button class="btn-clear" onclick="clearForm()">Clear</button>
        </div>

        <div class="card">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
                <tbody id="bookList"></tbody>
            </table>
        </div>

    </div>

    <script>
        // id of the book being edited (null means adding a new book)
        var editId = null;

        // get all books from server and show in table
        function loadBooks() {
            fetch("/books")
                .then(function (res) { return res.json(); })
                .then(function (books) {
                    var rows = "";

                    for (var i = 0; i < books.length; i++) {
                        var b = books[i];
                        rows += "<tr>" +
                            "<td>" + b.id + "</td>" +
                            "<td>" + b.title + "</td>" +
                            "<td>" + b.author + "</td>" +
                            "<td><span class='tag'>" + b.category + "</span></td>" +
                            "<td>" +
                            "<button class='btn-edit' onclick='editBook(" + b.id + ")'>Edit</button> " +
                            "<button class='btn-delete' onclick='deleteBook(" + b.id + ")'>Delete</button>" +
                            "</td>" +
                            "</tr>";
                    }

                    if (books.length == 0) {
                        rows = "<tr><td colspan='5' class='empty'>No books found</td></tr>";
                    }

                    document.getElementById("bookList").innerHTML = rows;
                    document.getElementById("count").innerText = books.length + " books";
                });
        }

        // add a new book or update an old one
        function saveBook() {
            var book = {
                title: document.getElementById("title").value,
                author: document.getElementById("author").value,
                category: document.getElementById("category").value
            };

            var url = "/books";
            var method = "POST";

            if (editId != null) {
                url = "/books/" + editId;
                method = "PUT";
            }

            fetch(url, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(book)
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data.error) {
                        alert(data.error);
                    } else {
                        clearForm();
                        loadBooks();
                    }
                });
        }

        // fill the form with the selected book
        function editBook(id) {
            fetch("/books")
                .then(function (res) { return res.json(); })
                .then(function (books) {
                    for (var i = 0; i < books.length; i++) {
                        if (books[i].id == id) {
                            document.getElementById("title").value = books[i].title;
                            document.getElementById("author").value = books[i].author;
                            document.getElementById("category").value = books[i].category;
                            editId = id;
                            document.getElementById("formHeading").innerText = "Update Book";
                        }
                    }
                });
        }

        // delete a book
        function deleteBook(id) {
            if (confirm("Are you sure you want to delete this book?")) {
                fetch("/books/" + id, { method: "DELETE" })
                    .then(function () { loadBooks(); });
            }
        }

        // clear the form and go back to add mode
        function clearForm() {
            document.getElementById("title").value = "";
            document.getElementById("author").value = "";
            document.getElementById("category").value = "";
            document.getElementById("formHeading").innerText = "Add New Book";
            editId = null;
        }

        loadBooks();
    </script>

</body>
</html>
