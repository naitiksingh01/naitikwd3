<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Event

    </title>
</head>
<body>
    <button onclick="openWindow()">
   Open New Window
    </button>
</body>
<script>
    function openWindow() {
        window.open("https://www.nike.com", "_blank", "width=800, height=600");

    }
</script>
</html>
